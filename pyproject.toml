[project]
name = "neuroprep-agentic"
version = "0.3.0"
description = "Dataset-agnostic agentic control plane for multimodal neurodata ingestion and preprocessing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "crewai[litellm]==1.15.13",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "mne>=1.9,<2",
  "mne-nirs>=0.7,<1",
  "nibabel>=5.3,<6",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "tifffile>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
neuroprep-agentic = "neuroprep_agentic.main:cli"
kickoff = "neuroprep_agentic.control:kickoff"
plot = "neuroprep_agentic.control:plot"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
