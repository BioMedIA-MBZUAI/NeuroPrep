[project]
name = "neuroprep-agentic"
dynamic = ["version", "readme"]
description = "Dataset-agnostic agentic control plane for multimodal neurodata ingestion and preprocessing"
requires-python = ">=3.11,<3.14"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "CITATION.cff"]
authors = [{ name = "Salma Hassan" }]
keywords = ["neuroimaging", "BIDS", "workflow", "agentic", "LLM", "preprocessing", "MRI", "PET", "EEG"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "crewai[litellm,anthropic]==1.15.13",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "mne>=1.9,<2",
  "h5py>=3.10,<4",  # SNIRF (fNIRS) reading via mne.io.read_raw_snirf
  "nibabel>=5.3,<6",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "tifffile>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.urls]
Documentation = "https://biomedia-mbzuai.github.io/NeuroPrep/"
Repository = "https://github.com/BioMedIA-MBZUAI/NeuroPrep"
Issues = "https://github.com/BioMedIA-MBZUAI/NeuroPrep/issues"
Changelog = "https://github.com/BioMedIA-MBZUAI/NeuroPrep/blob/main/CHANGELOG.md"

[project.scripts]
neuroprep-agentic = "neuroprep_agentic.main:cli"
kickoff = "neuroprep_agentic.control:kickoff"
plot = "neuroprep_agentic.control:plot"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
docs = [
  "mkdocs-material>=9.6,<10",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

# PyPI cannot render repo-relative links or mermaid, so the package page gets a copy of
# README.md with absolute GitHub links, a PNG logo and the diagrams replaced by text.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'docs/assets/neuroprep-logo\.svg'
replacement = 'https://raw.githubusercontent.com/BioMedIA-MBZUAI/NeuroPrep/main/docs/assets/neuroprep-logo.png'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)```mermaid\nflowchart LR\n.*?\n```'
replacement = 'Request → typed policy (LLM, schema-validated) → inventory, identity and BIDS mapping → compiled task DAG → pilot of every competing backend on one participant → signed evidence (HMAC, git-bound) → backend selection with recorded reasons → production run (local or Slurm) → contract check → atomic release with a model-ready index.'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(href="|\]\()#'
replacement = '\g<1>https://github.com/BioMedIA-MBZUAI/NeuroPrep#'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src="|href="|\]\()(?!https?:|mailto:|#)'
replacement = '\g<1>https://github.com/BioMedIA-MBZUAI/NeuroPrep/blob/main/'

[tool.hatch.version]
path = "src/neuroprep_agentic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroprep_agentic"]

[tool.hatch.build.targets.sdist]
# Ship code, tests and docs only: never evidence, state, logs or cluster output.
include = [
  "src/neuroprep_agentic",
  "tests",
  "examples/*.json",
  "examples/*.txt",
  "README.md",
  "CHANGELOG.md",
  "pyproject.toml",
  "LICENSE",
  "CITATION.cff",
]
# Site launchers (scripts/) and the paper's prompt records (examples/requests/) stay in git.
exclude = ["**/__pycache__", "**/*.py[cod]", "tests/test_launchers.py"]

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/neuroprep_agentic/vendor"]  # vendored NeuroPrep v4, kept unchanged

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
